<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalX | Ultra-Tool Access v5.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding-bottom: 50px; }
        .header { width: 100%; background: #161b22; padding: 20px 0; text-align: center; border-bottom: 3px solid #00d1b2; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-family: 'Orbitron', sans-serif; color: #00d1b2; margin: 0; font-size: 22px; text-shadow: 0 0 10px rgba(0,209,178,0.5); }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: auto; }
        .card { background: #1c2128; border: 1px solid #30363d; border-radius: 12px; padding: 20px; text-align: center; transition: 0.3s; }
        .card:hover { border-color: #00d1b2; transform: translateY(-5px); }
        .card h2 { color: #fff; font-family: 'Orbitron', sans-serif; font-size: 16px; margin-bottom: 15px; }
        input, select { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; text-align: center; }
        .btn { background: #00d1b2; color: #000; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-family: 'Orbitron', sans-serif; transition: 0.3s; }
        .btn:hover { background: #00fa9a; box-shadow: 0 0 15px rgba(0,250,154,0.4); }
        .loader-box { display: none; margin-top: 20px; }
        .bar { width: 100%; background: #0d1117; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 10px; }
        .progress { width: 0%; height: 100%; background: #00d1b2; transition: 0.1s; }
        .status { font-size: 11px; color: #8b949e; margin-top: 8px; font-style: italic; }
        .badge { background: #ff4757; color: white; padding: 3px 8px; border-radius: 5px; font-size: 10px; position: absolute; margin-top: -35px; margin-left: 80px; }
    </style>
</head>
<body>

<div class="header">
    <h1>GLOBAL-X MEGA HUB</h1>
</div>

<div class="grid-container">

    <div class="card">
        <span class="badge">POPÜLER</span>
        <h2>🎮 OYUN HİLE MERKEZİ</h2>
        <select id="game-select">
            <option>PUBG Mobile (UC)</option>
            <option>Brawl Stars (Elmas)</option>
            <option>Roblox (Robux)</option>
            <option>Free Fire (Elmas)</option>
        </select>
        <div id="ui-1">
            <input type="text" placeholder="Oyuncu ID Giriniz">
            <button class="btn" onclick="start('1')">HİLEYİ AKTİF ET</button>
        </div>
        <div id="loader-1" class="loader-box">
            <div class="bar"><div id="prog-1" class="progress"></div></div>
            <p id="stat-1" class="status">Sunucuya bağlanılıyor...</p>
        </div>
    </div>

    <div class="card">
        <h2>🔍 PROFİL ANALİZÖRÜ</h2>
        <select id="social-select">
            <option>Instagram Gizli Profil Gör</option>
            <option>TikTok Takipçi Artır</option>
            <option>Twitter Kim Baktı?</option>
        </select>
        <div id="ui-2">
            <input type="text" placeholder="@kullaniciadi">
            <button class="btn" style="background: #e84393;" onclick="start('2')">İŞLEMİ BAŞLAT</button>
        </div>
        <div id="loader-2" class="loader-box">
            <div class="bar"><div id="prog-2" class="progress"></div></div>
            <p id="stat-2" class="status">Analiz ediliyor...</p>
        </div>
    </div>

    <div class="card">
        <h2>📺 PREMIUM HESAP DAĞITICI</h2>
        <select id="stream-select">
            <option>Netflix UHD Premium</option>
            <option>Spotify Family (1 Yıllık)</option>
            <option>Disney+ Üyelik</option>
        </select>
        <div id="ui-3">
            <input type="email" placeholder="E-posta Adresiniz">
            <button class="btn" style="background: #f1c40f;" onclick="start('3')">HESABI OLUŞTUR</button>
        </div>
        <div id="loader-3" class="loader-box">
            <div class="bar"><div id="prog-3" class="progress"></div></div>
            <p id="stat-3" class="status">Hesap havuzu taranıyor...</p>
        </div>
    </div>

    <div class="card">
        <h2>🎁 HEDİYE KODU GENERATOR</h2>
        <select id="gift-select">
            <option>100$ Steam Cüzdan Kodu</option>
            <option>500 TL Google Play Kodu</option>
            <option>Amazon Hediye Çeki</option>
        </select>
        <div id="ui-4">
            <button class="btn" style="background: #2ed573;" onclick="start('4')">KODU ÜRET</button>
        </div>
        <div id="loader-4" class="loader-box">
            <div class="bar"><div id="prog-4" class="progress"></div></div>
            <p id="stat-4" class="status">Kod algoritması çözülüyor...</p>
        </div>
    </div>

</div>

<script>
    function start(id) {
        document.getElementById('ui-' + id).style.display = 'none';
        document.getElementById('loader-' + id).style.display = 'block';
        
        let prog = document.getElementById('prog-' + id);
        let stat = document.getElementById('stat-' + id);
        let width = 0;
        
        let interval = setInterval(() => {
            if(width >= 100) {
                clearInterval(interval);
                stat.innerText = "DOĞRULAMA GEREKLİ! YÖNLENDİRİLİYOR...";
                setTimeout(() => {
                    // SENİN SMARTLINK'İN
                    window.location.href = "https://www.effectivegatecpm.com/ux9wug28g?key=4baebeda162ba4927a340c4eb63ba679";
                }, 800);
            } else {
                width += Math.random() * 4;
                if(width > 100) width = 100;
                prog.style.width = width + "%";
                if(width > 30) stat.innerText = "Veriler işleniyor...";
                if(width > 60) stat.innerText = "Bot koruması aşılıyor...";
                if(width > 85) stat.innerText = "Final onayı bekleniyor...";
            }
        }, 120);
    }
</script>

</body>
</html>
